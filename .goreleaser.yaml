# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: git-quill

before:
  hooks:
    - go mod tidy

builds:
  - id: git-quill
    main: ./cmd/git-quill
    binary: git-quill
    env:
      - CGO_ENABLED=0 # fully static: keychain, clipboard and TUI are pure Go
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/tonklasocute/git-quill/internal/cli.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.th.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: tonklasocute
    name: git-quill
  draft: false
  prerelease: auto

# Homebrew cask in github.com/tonklasocute/homebrew-tap.
# Publishing needs a HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with
# contents:write on homebrew-tap); without it the cask is generated but not
# uploaded, so releases never fail because of the tap.
homebrew_casks:
  - name: git-quill
    repository:
      owner: tonklasocute
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/tonklasocute/git-quill
    description: AI commit messages, PR descriptions, changelogs and reviews from your git diff
    license: MIT
    binaries: [git-quill]
    # Release binaries are not code-signed. (A postflight hook that strips the
    # quarantine flag is deprecated in Homebrew 7, so explain it instead.)
    caveats: |
      git-quill is not code-signed. If macOS blocks it, run:
        xattr -d com.apple.quarantine "$(brew --prefix)/bin/git-quill"

